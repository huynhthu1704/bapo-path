name: AI code review

# The independent review of compass/REVIEW.md (REQ-028): Claude reviews every ready pull request and posts
# "## Independent review (Claude)" with a verdict. It does not approve or merge itself: the author agent merges with
# compass/merge-pr.mjs, which requires that APPROVE for the head commit (ADR-006).
#
# Opt-in. Add ONE of these repository secrets (Settings → Secrets and variables → Actions):
#   CLAUDE_CODE_OAUTH_TOKEN  uses your Claude Pro/Max subscription, no API billing.
#                            Create it on your computer with `claude setup-token`
#                            (or run /install-github-app in Claude Code, which sets this up).
#   ANTHROPIC_API_KEY        pay-as-you-go API key from console.anthropic.com.
# If both are set, the subscription token is used. With neither, the job is skipped.
# Draft PRs are not reviewed; mark the PR "Ready for review" to start a review.
on:
  pull_request:
    types: [opened, synchronize, ready_for_review]

permissions:
  contents: read
  pull-requests: write
  id-token: write

jobs:
  review:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    env:
      HAS_OAUTH: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
      HAS_API_KEY: ${{ secrets.ANTHROPIC_API_KEY != '' }}
      REVIEW_PROMPT: |
        REPO: ${{ github.repository }}
        PR NUMBER: ${{ github.event.pull_request.number }}

        HEAD COMMIT: ${{ github.event.pull_request.head.sha }}

        You are the independent reviewer for BAPO Path: you did not write this code. Follow compass/REVIEW.md exactly.
        Read AGENTS.md, CLAUDE.md and compass/REVIEW.md first. Get the diff with `gh pr diff ${{ github.event.pull_request.number }}`
        and the PR body with `gh pr view ${{ github.event.pull_request.number }}`. Read the linked requirements in
        compass/spec.json and the plan file in compass/plans/, and check the diff against them.
        Review passes, in this order: security and privacy, correctness, requirement match, Compass contract, maintainability.
        Leave inline comments on specific lines with mcp__github_inline_comment__create_inline_comment,
        then ONE summary comment with `gh pr comment` that starts with `## Independent review (Claude)` in the
        comment format of compass/REVIEW.md, with `Reviewed commit: ${{ github.event.pull_request.head.sha }}`.
        Verdict CHANGES NEEDED exactly when there is at least one important finding. Write in plain English. At most 5 nits.
        If the PR has the `bug` label: you cannot run Playwright here, so write the line
        `Test-first run: not run (CI reviewer) — needs an in-session reviewer` in your comment; never claim a run you did not do.
      ALLOWED_TOOLS: >-
        --allowedTools "mcp__github_inline_comment__create_inline_comment,Bash(gh pr comment:*),Bash(gh pr diff:*),Bash(gh pr view:*),Read,Glob,Grep"
    steps:
      - name: Skip when no Claude credential is set
        if: env.HAS_OAUTH != 'true' && env.HAS_API_KEY != 'true'
        run: echo "::notice::Neither CLAUDE_CODE_OAUTH_TOKEN nor ANTHROPIC_API_KEY is set; AI review skipped."
      - uses: actions/checkout@v7
        if: env.HAS_OAUTH == 'true' || env.HAS_API_KEY == 'true'
        with:
          fetch-depth: 1

      - name: Review with the Claude subscription
        if: env.HAS_OAUTH == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.ALLOWED_TOOLS }}

      - name: Review with the API key
        if: env.HAS_OAUTH != 'true' && env.HAS_API_KEY == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          anthropic_api_key: ${{ secrets.ANTHROPIC_API_KEY }}
          prompt: ${{ env.REVIEW_PROMPT }}
          claude_args: ${{ env.ALLOWED_TOOLS }}
