name: Firestore rules tests

on:
  pull_request:
  push:
    branches: [main]
    paths: ['firestore.rules', 'tests/**']

jobs:
  rules:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      - run: npm run check:prompts
      - name: Run rules tests against the Firestore emulator
        run: npx -y firebase-tools@15 emulators:exec --only firestore --project demo-bapo "npm run test:rules"
